<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEB 打卡系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- 請將下面的 src 網址替換為你真實的 GAS /exec 網址 -->
  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzxOpCI4OvMyfH_S6CCeW_F2heA3rZ9bgCWd4h04FVTkwahk0dHVBfCfGm_1X-HB2Om/exec"
    allow="geolocation">
  </iframe>

  <script>
    // 註冊 Service Worker 以達到 PWA 標準
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }

    window.addEventListener('load', function() {
  setTimeout(function() {
    try {
      let savedEmail = localStorage.getItem('auto_login_email');
      let savedPass = localStorage.getItem('auto_login_pass');

      if (savedEmail && savedPass) {
        let emailInput = document.getElementById('login-email');
        let passInput = document.getElementById('login-pass');
        let rememberBox = document.getElementById('remember-me');

        if (emailInput && passInput) {
          emailInput.value = savedEmail;
          passInput.value = savedPass;
          if (rememberBox) rememberBox.checked = true;

          // 自動執行登入
          if (typeof handleLogin === 'function') {
            handleLogin();
          }
        }
      }
    } catch (e) {
      console.log('PWA LocalStorage 存取失敗:', e);
    }
  }, 300); // 延遲 300ms 確保 iOS PWA 內部資源載入完畢
});

// 處理登入動作
function handleLogin() {
  let email = document.getElementById('login-email').value.trim();
  let pass = document.getElementById('login-pass').value.trim();
  let remember = document.getElementById('remember-me').checked;

  if (!email || !pass) return alert('請輸入帳號與密碼');

  google.script.run.withSuccessHandler(res => {
    if (res.success) {
      if (remember) {
        // 寫入當前 App 獨立沙盒的 LocalStorage
        localStorage.setItem('auto_login_email', email);
        localStorage.setItem('auto_login_pass', pass);
      } else {
        localStorage.removeItem('auto_login_email');
        localStorage.removeItem('auto_login_pass');
      }
      enterApp(res);
    } else {
      alert(res.message);
    }
  }).loginUser(email, pass);
}
  </script>
</body>
</html>
