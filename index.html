<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEB 打卡系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzxOpCI4OvMyfH_S6CCeW_F2heA3rZ9bgCWd4h04FVTkwahk0dHVBfCfGm_1X-HB2Om/exec"
    allow="geolocation">
  </iframe>

  <script>
    const iframe = document.getElementById('app-frame');

    // PWA Service Worker 註冊
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }

    // 接收來自 iframe (GAS) 的跨網域訊息
    window.addEventListener('message', function(event) {
      if (!event.data || typeof event.data !== 'object') return;

      const action = event.data.action;
      
      if (action === 'SAVE_CREDENTIALS') {
        // GAS 登入成功後要求外層儲存憑證
        localStorage.setItem('pwa_auto_email', event.data.email);
        localStorage.setItem('pwa_auto_pass', event.data.pass);
      } else if (action === 'CLEAR_CREDENTIALS') {
        // 登出時清空外層憑證
        localStorage.removeItem('pwa_auto_email');
        localStorage.removeItem('pwa_auto_pass');
      } else if (action === 'REQUEST_CREDENTIALS') {
        // GAS 載入完成，向外層索取帳密
        sendCredentialsToFrame();
      }
    });

    // 當 iframe 載入完成時，主動傳送儲存的帳密
    iframe.onload = function() {
      sendCredentialsToFrame();
    };

    function sendCredentialsToFrame() {
      const savedEmail = localStorage.getItem('pwa_auto_email');
      const savedPass = localStorage.getItem('pwa_auto_pass');

      if (savedEmail && savedPass) {
        iframe.contentWindow.postMessage({
          action: 'AUTO_LOGIN',
          email: savedEmail,
          pass: savedPass
        }, '*');
      }
    }
  </script>
</body>
</html>
