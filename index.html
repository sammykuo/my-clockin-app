<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEB 打卡與請假系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; }
    .btn { padding: 12px 24px; font-size: 18px; background: #0d6efd; color: white; border: none; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>WEB 打卡與請假系統</h2>
  <button class="btn" onclick="handleClockIn()">立即打卡</button>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzxOpCI4OvMyfH_S6CCeW_F2heA3rZ9bgCWd4h04FVTkwahk0dHVBfCfGm_1X-HB2Om/exec";

    async function handleClockIn() {
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "clockIn", userId: "EMP001" })
      });
      const res = await response.json();
      alert(res.message || "打卡完成！");
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
